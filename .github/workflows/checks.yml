name: Security and build checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: campus-vercel/package-lock.json
      - run: python3 scripts/check-source.py
      - run: npm ci
        working-directory: campus-vercel
      - run: npm test
        working-directory: campus-vercel
      - run: npx tsc --noEmit
        working-directory: campus-vercel
      - run: npm run build
        working-directory: campus-vercel
      - run: npm audit --audit-level=high
        working-directory: campus-vercel

  homework-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm audit --package-lock-only --audit-level=high
        working-directory: campus-web
